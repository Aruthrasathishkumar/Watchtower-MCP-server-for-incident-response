# Loki configuration for WatchTower's local cluster.
# Single-binary mode — everything in one pod. Suitable for dev / single-node.
# Retention is short to stay within minikube's disk budget.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h  # 3 days of logs; plenty for dev, cheap
    allow_structured_metadata: true
    volume_enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 768Mi
      cpu: 500m

# Disable the components we don't need in single-binary mode
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Gateway provides a stable endpoint but adds complexity; disable for now
gateway:
  enabled: false

# Test pod we don't need
test:
  enabled: false

# Monitoring integration (ServiceMonitors etc.) — disable for now
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
  serviceMonitor:
    enabled: false